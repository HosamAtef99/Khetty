<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>خطتي</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1F5C4D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --g:#1F5C4D; --g2:#2C7A65; --a:#C97B3A; --cream:#F7F4EF;
    --bg:#FFFFFF; --ink:#23282B; --mut:#7A8287; --line:#E7E1D6; --bad:#A8443C;
  }
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Arabic",Tahoma,sans-serif;
    direction:rtl;font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
  #app{padding:0 0 78px 0;max-width:520px;margin:0 auto}

  /* header */
  .hd{background:var(--g);color:#fff;padding:16px 16px 18px;border-radius:0 0 18px 18px}
  .hd .dt{font-size:12.5px;opacity:.82}
  .hd h1{margin:2px 0 0;font-size:20px;font-weight:700}
  .hd .streak{float:left;background:rgba(255,255,255,.16);padding:5px 11px;border-radius:20px;font-size:12.5px;margin-top:2px}

  /* cards */
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 16px}
  .card h3{margin:0 0 10px;font-size:15.5px;color:var(--g);display:flex;align-items:center;gap:7px}
  .card h3 .tag{margin-right:auto;font-size:11.5px;color:var(--mut);font-weight:400}

  /* progress bars */
  .bar{height:9px;background:#EFEBE3;border-radius:6px;overflow:hidden;margin:5px 0 2px}
  .bar i{display:block;height:100%;background:var(--g);border-radius:6px;transition:width .35s}
  .bar.p i{background:var(--a)}
  .lab{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut)}
  .lab b{color:var(--ink)}

  /* workout card */
  .wk{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;border:none}
  .wk h3{color:#fff}
  .wk .nm{font-size:19px;font-weight:700;margin:2px 0}
  .wk .en{font-size:12px;opacity:.75;letter-spacing:.3px}
  .wk .meta{font-size:13px;opacity:.9;margin-top:6px}
  .btn{display:block;width:100%;padding:13px;border:none;border-radius:11px;
    background:#fff;color:var(--g);font-size:15.5px;font-weight:700;margin-top:12px;
    font-family:inherit;cursor:pointer}
  .btn.done{background:rgba(255,255,255,.2);color:#fff}
  .btn2{background:var(--g);color:#fff}
  .btn3{background:var(--cream);color:var(--g);border:1px solid var(--line)}

  /* meal rows */
  .meal{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-bottom:1px solid #F0ECE4}
  .meal:last-child{border:none;padding-bottom:0}
  .chk{flex:0 0 24px;width:24px;height:24px;border:2px solid var(--line);border-radius:8px;
    margin-top:3px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;cursor:pointer}
  .chk.on{background:var(--g);border-color:var(--g)}
  .meal .tx{flex:1;min-width:0}
  .meal .t1{font-size:12px;color:var(--a);font-weight:700}
  .meal .t2{font-size:14px;line-height:1.55}
  .meal.on .t2{text-decoration:line-through;color:var(--mut)}
  .meal .t3{font-size:11.5px;color:var(--mut);margin-top:2px}

  /* nav */
  nav{position:fixed;bottom:0;right:0;left:0;background:rgba(255,255,255,.97);
    border-top:1px solid var(--line);display:flex;padding:7px 0 max(7px,env(safe-area-inset-bottom));
    max-width:520px;margin:0 auto;backdrop-filter:blur(8px);z-index:50}
  nav button{flex:1;background:none;border:none;font-family:inherit;color:var(--mut);
    font-size:11px;padding:4px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
  nav button .ic{font-size:19px;line-height:1}
  nav button.on{color:var(--g);font-weight:700}

  /* day list */
  .drow{display:flex;align-items:center;gap:11px;padding:13px 14px;border:1px solid var(--line);
    border-radius:12px;margin-bottom:9px;cursor:pointer;background:#fff}
  .drow.today{border-color:var(--g);border-width:2px;background:#F6FAF8}
  .drow .dd{flex:0 0 46px;text-align:center;font-weight:700;color:var(--g);font-size:13.5px}
  .drow .di{flex:1;min-width:0}
  .drow .di b{font-size:14.5px;display:block}
  .drow .di span{font-size:11.5px;color:var(--mut)}
  .drow .dm{font-size:12px;color:var(--a);font-weight:700;white-space:nowrap}

  /* tables */
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{background:var(--g);color:#fff;padding:8px;text-align:right;font-size:12.5px;font-weight:700}
  td{padding:8px;border-bottom:1px solid #F0ECE4}
  tr:last-child td{border:none}
  .hi{color:var(--g);font-weight:700}
  .lo{color:var(--bad);font-weight:700}
  .tw{overflow:hidden;border:1px solid var(--line);border-radius:12px}

  input,select{font-family:inherit;font-size:15px;padding:11px;border:1px solid var(--line);
    border-radius:10px;width:100%;background:#fff;color:var(--ink)}
  .row{display:flex;gap:9px;align-items:center}

  .note{background:var(--cream);border-right:3px solid var(--a);padding:10px 12px;
    border-radius:8px;font-size:13px;margin:11px 0;line-height:1.65}
  .note b{color:var(--g)}
  .muted{color:var(--mut);font-size:12.5px}
  h2.sec{margin:20px 16px 8px;font-size:16px;color:var(--g)}

  /* timer overlay */
  #tm{position:fixed;inset:0;background:var(--g);color:#fff;z-index:100;display:none;
    flex-direction:column;padding:22px 20px max(22px,env(safe-area-inset-bottom));text-align:center}
  #tm.show{display:flex}
  #tm .ph{font-size:13px;opacity:.75;letter-spacing:1px}
  #tm .ex{direction:ltr;font-size:26px;font-weight:700;margin:8px 0 2px;line-height:1.35}
  #tm .exe{font-size:13px;opacity:.7}
  #tm .cd{font-size:76px;font-weight:800;line-height:1;margin:22px 0;font-variant-numeric:tabular-nums}
  #tm .nx{font-size:13.5px;opacity:.8;min-height:22px}
  #tm .alt{font-size:12.5px;opacity:.7;margin-top:6px;min-height:20px}
  #tm .pb{height:6px;background:rgba(255,255,255,.2);border-radius:4px;margin:16px 0 6px}
  #tm .pb i{display:block;height:100%;background:#fff;border-radius:4px;transition:width .3s}
  #tm .ctl{display:flex;gap:10px;margin-top:auto}
  #tm .ctl button{flex:1;padding:14px;border:none;border-radius:12px;font-family:inherit;
    font-size:15px;font-weight:700;cursor:pointer;background:rgba(255,255,255,.18);color:#fff}
  #tm .ctl button.main{background:#fff;color:var(--g)}
  #tm.rest{background:var(--a)}
  #tm .cnt{font-size:13px;opacity:.8}

  .yt{display:inline-block;background:var(--cream);color:var(--g);border:1px solid var(--line);
    border-radius:8px;padding:4px 8px;font-size:11px;font-weight:700;text-decoration:none;white-space:nowrap}

  /* swap */
  .swbtn{background:var(--cream);border:1px solid var(--line);color:var(--g);border-radius:8px;
    padding:3px 9px;font-size:11px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:5px}
  .pill{display:inline-block;padding:7px 13px;border-radius:20px;border:1px solid var(--line);
    background:#fff;font-size:13px;margin:0 0 7px 6px;cursor:pointer;font-family:inherit;color:var(--ink)}
  .pill.on{background:var(--g);color:#fff;border-color:var(--g)}
  .res{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:13px}
  .res .top{background:var(--g);color:#fff;padding:13px 15px}
  .res .top .v{font-size:12px;opacity:.85}
  .res .top .n{font-size:19px;font-weight:700;margin-top:1px}
  .res.warn .top{background:var(--a)}
  .res.hot .top{background:var(--bad)}
  .res .big{display:flex;text-align:center;border-bottom:1px solid var(--line)}
  .res .big div{flex:1;padding:13px 4px;border-left:1px solid var(--line)}
  .res .big div:last-child{border:none}
  .res .big b{display:block;font-size:22px;font-weight:800;color:var(--g);line-height:1.25}
  .res .big span{font-size:11.5px;color:var(--mut)}
  .res .bd{padding:13px 15px;font-size:13.5px;line-height:1.7}
  .res .bd .k{color:var(--a);font-weight:700;font-size:12px;display:block;margin-top:9px}
  .exrow{display:flex;align-items:center;gap:9px;padding:11px 0;border-bottom:1px solid #F0ECE4}
  .exrow:last-of-type{border:none}
  .exi{flex:1;min-width:0}
  .exi b{display:block;font-size:14.5px}
  .altbox{background:var(--cream);border-radius:11px;padding:11px;margin:0 0 10px}
  .altrow{display:flex;align-items:center;gap:9px;padding:9px 10px;background:#fff;
    border:1px solid var(--line);border-radius:9px;margin-bottom:6px;cursor:pointer}
  .altrow b{font-size:13.5px}
  .stp{width:26px;height:26px;border:1px solid var(--line);background:#fff;border-radius:7px;
    font-size:15px;line-height:1;color:var(--g);font-family:inherit;cursor:pointer;vertical-align:middle}
  .spin{text-align:center;padding:26px;color:var(--mut);font-size:13.5px}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--g);
    margin:0 2px;animation:bb 1s infinite}
  .dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}
  @keyframes bb{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-5px)}}
  .hist{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .hist button{background:var(--cream);border:1px solid var(--line);border-radius:16px;
    padding:5px 11px;font-size:12px;font-family:inherit;color:var(--ink);cursor:pointer}

  #tm .ytl{display:inline-block;margin-top:10px;color:#fff;background:rgba(255,255,255,.18);
    border-radius:9px;padding:7px 15px;font-size:12.5px;text-decoration:none;font-weight:700}
  .empty{text-align:center;color:var(--mut);padding:26px 12px;font-size:13.5px}
  .chartwrap{overflow:hidden}
  .wlist div{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #F0ECE4;font-size:13.5px}
  .wlist div:last-child{border:none}
  .del{color:var(--bad);cursor:pointer;font-size:12px;padding:0 6px}
</style>
</head>
<body>
<div id="app"></div>

<div id="tm">
  <div class="ph" id="tmPh"></div>
  <div class="ex" id="tmEx"></div>
  <div class="exe" id="tmExE"></div>
  <div class="cd" id="tmCd">00</div>
  <div class="nx" id="tmNx"></div>
  <div class="alt" id="tmAlt"></div>
  <a class="ytl" id="tmYt" href="#" target="_blank" rel="noopener">▶ شوف الأداء على يوتيوب</a>
  <div class="pb"><i id="tmPb" style="width:0%"></i></div>
  <div class="cnt" id="tmCnt"></div>
  <div class="ctl">
    <button onclick="tmQuit()">إنهاء</button>
    <button id="tmSnd" onclick="toggleSnd()" style="flex:0 0 52px">🔊</button>
    <button class="main" id="tmPause" onclick="tmToggle()">إيقاف مؤقت</button>
    <button onclick="tmSkip()">تخطي</button>
  </div>
</div>

<nav>
  <button data-t="today" class="on" onclick="go('today')"><span class="ic">◉</span>النهاردة</button>
  <button data-t="swap" onclick="go('swap')"><span class="ic">⇄</span>بديل</button>
  <button data-t="week" onclick="go('week')"><span class="ic">▤</span>الأسبوع</button>
  <button data-t="food" onclick="go('food')"><span class="ic">✦</span>الأكل</button>
  <button data-t="weight" onclick="go('weight')"><span class="ic">▲</span>الوزن</button>
</nav>

/* ============ WORKOUTS ============ */
const W = {

function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

const HAS_CS = (typeof window!=='undefined' && window.storage && typeof window.storage.get==='function');

async function load(){
  try{
    let raw = null;
    if(HAS_CS){ const r = await window.storage.get(KEY); raw = r && r.value; }
    else { raw = localStorage.getItem(KEY); }
    if(raw){ const o = JSON.parse(raw); S.log=o.log||{}; S.weights=o.weights||[]; S.hist=o.hist||[]; S.wex=o.wex||{}; S.wday=o.wday||{}; }
  }catch(e){ /* first run */ }
}
let saveT=null;
function save(){
  clearTimeout(saveT);
  saveT = setTimeout(async ()=>{
    const raw = JSON.stringify(S);
    try{
      if(HAS_CS) await window.storage.set(KEY, raw);
      else localStorage.setItem(KEY, raw);
    }catch(e){ console.error('save failed', e); }
  }, 260);
}

function entry(d){ if(!S.log[d]) S.log[d] = { w:false, m:{}, sw:{} }; if(!S.log[d].sw) S.log[d].sw={}; return S.log[d]; }

/* what a meal actually counts as today (planned, or the swap he logged) */
function mealNow(meals, i, e){
  const o = e.sw[i];
  if(o){
    const parts = (o.items && o.items.length)
      ? o.items.map(x=>`${x.n} ${x.g} جم`).join(' + ')
      : `${o.n} — ${o.g||''} جم`;
    return { t: meals[i].t, d: parts, k:o.k, p:o.p, swapped:true };
  }
  return { t: meals[i].t, d: meals[i].d, k: meals[i].k, p: meals[i].p, free: meals[i].free };
}

function streak(){
  let n=0; const d=new Date();
  for(let i=0;i<400;i++){
    const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const e=S.log[k];
    const active = e && (e.w || Object.values(e.m||{}).some(Boolean));
    if(active) n++;
    else if(i>0) break;
    d.setDate(d.getDate()-1);
  }
  return n;
}

function chart(ws){
  const W_=440,H=170,pd=26;
  const vals = ws.map(x=>x.w);
  let mn = Math.min(...vals, TARGET.goal), mx = Math.max(...vals);
  const sp = (mx-mn)||1; mn-=sp*0.12; mx+=sp*0.12;
  const X = i => pd + (i/(Math.max(1,ws.length-1)))*(W_-pd*2);
  const Y = v => H-pd - ((v-mn)/(mx-mn))*(H-pd*2);
  let pts = ws.map((x,i)=>`${X(i)},${Y(x.w)}`).join(' ');
  const gy = Y(TARGET.goal);
  return `<svg viewBox="0 0 ${W_} ${H}" style="width:100%;height:auto;display:block">
    <line x1="${pd}" y1="${gy}" x2="${W_-pd}" y2="${gy}" stroke="#C97B3A" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="${W_-pd}" y="${gy-6}" fill="#C97B3A" font-size="11" text-anchor="end">الهدف ${TARGET.goal}</text>
    <polyline points="${pts}" fill="none" stroke="#1F5C4D" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${ws.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x.w)}" r="3.5" fill="#1F5C4D"/>`).join('')}
    <text x="${pd}" y="${H-6}" fill="#7A8287" font-size="10">${ws[0].d.slice(5)}</text>
    <text x="${W_-pd}" y="${H-6}" fill="#7A8287" font-size="10" text-anchor="end">${ws[ws.length-1].d.slice(5)}</text>
  </svg>`;
}

function exByEn(en){ return EXB.find(x=> x.e === en) || null; }
function groupOf(en){ const x = exByEn(en); return x ? x.g : 'cardio'; }
function lvlOf(en){ const x = exByEn(en); return x ? x.lvl : 2; }
function altsFor(en){
  const g = groupOf(en);
  return EXB.filter(x=> x.g === g && x.e !== en).sort((a,b)=> a.lvl - b.lvl);
}

/* ---- التمرين بعد أي تبديل حفظه المستخدم ---- */
function workoutOf(di){
  const base = W[ (S.wday && S.wday[di]) || DAYS[di].w ];
  const ov = S.wex && S.wex[di];
  if(!ov) return base;
  const list = (base.ex || base.seq || []).map((x,i)=>{
    const rep = ov[i] && exByEn(ov[i]);
    return rep ? {a:rep.a, e:rep.e, alt:rep.alt} : x;
  });
  const out = Object.assign({}, base);
  if(base.ex) out.ex = list; else out.seq = list;
  return out;
}
function isEdited(di){
  return !!((S.wday && S.wday[di]) || (S.wex && S.wex[di] && Object.keys(S.wex[di]).length));
}

/* ---- تطبيع النص العربي ---- */
function normAr(s){
  return (s||'').toString()
    .replace(/[\u064B-\u0652\u0670]/g,'')
    .replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/[ىی]/g,'ي').replace(/ؤ/g,'و').replace(/ئ/g,'ي')
    .replace(/\u0640/g,'')
    .replace(/\s+/g,' ').trim().toLowerCase();
}
function stripAl(s){ return s.replace(/(^|\s)ال(?=\S)/g,'$1'); }
function key(s){ return stripAl(normAr(s)); }

/* فهرس البحث: كل الأسماء والمرادفات */
const FIDX = [];
FDB.forEach((f,i)=>{ [f.n, ...(f.a||[])].forEach(nm=> FIDX.push({k:key(nm), i, len:key(nm).split(' ').length})); });
FIDX.sort((a,b)=> b.k.length - a.k.length);   // الأطول الأول عشان الأسماء المركبة

function findFood(tok){
  const t = key(tok);
  if(!t) return null;
  let hit = FIDX.find(x=> x.k === t);
  if(hit) return FDB[hit.i];
  hit = FIDX.find(x=> t.includes(x.k) || x.k.includes(t));
  if(hit) return FDB[hit.i];
  const words = t.split(' ').filter(w=>w.length>2);
  hit = FIDX.find(x=> words.some(w=> x.k.includes(w)));
  return hit ? FDB[hit.i] : null;
}

/* ---- تقسيم الجملة لأصناف ---- */
function parseQuery(q){
  let t = ' ' + key(q) + ' ';
  const found = [];
  // احجز الأسماء المركبة الأول (ورق عنب / مكرونة بشاميل / لسان عصفور ...)
  FIDX.filter(x=>x.len>1).forEach(x=>{
    const pat = ' ' + x.k + ' ';
    let idx = t.indexOf(pat);
    while(idx !== -1){
      found.push(FDB[x.i]);
      t = t.slice(0, idx+1) + '§' + found.length + '§ ' + t.slice(idx + pat.length);
      idx = t.indexOf(pat);
    }
  });
  const parts = t.split(/\s*[+,،]\s*|\s+مع\s+|\s+و(?=\S)/).map(s=>s.trim()).filter(Boolean);
  const items = [], unknown = [];
  parts.forEach(p=>{
    const m = p.match(/^§(\d+)§$/);
    if(m){ items.push({f: found[+m[1]-1]}); return; }
    const clean = p.replace(/§\d+§/g,'').trim();
    if(!clean) return;
    const f = findFood(clean);
    if(f) items.push({f}); else unknown.push(clean);
  });
  // شيل التكرار
  const seen = new Set(), out = [];
  items.forEach(it=>{ if(!seen.has(it.f.n)){ seen.add(it.f.n); out.push(it); } });
  return {items: out, unknown};
}

/* ---- توزيع الكميات على ميزانية السعرات ---- */
function kcalOf(items){ return items.reduce((s,it)=> s + it.f.k*it.g/100, 0); }
function protOf(items){ return items.reduce((s,it)=> s + it.f.p*it.g/100, 0); }

function allocate(items, target){
  items.forEach(it=> it.g = it.f.d);
  let guard = 0;
  while(kcalOf(items) > target*1.02 && guard++ < 400){
    let moved = false;
    for(const cls of SHRINK){
      const it = items.find(x => x.f.cls===cls && x.g > x.f.d*FLOOR[cls] + 1);
      if(it){ it.g = Math.max(Math.round(it.f.d*FLOOR[cls]), it.g - 10); moved = true; break; }
    }
    if(!moved) break;
  }
  guard = 0;
  while(kcalOf(items) < target*0.94 && guard++ < 400){
    let moved = false;
    for(const cls of GROW){
      const it = items.find(x => x.f.cls===cls && x.g < x.f.d*CEIL[cls] - 1);
      if(it){ it.g = Math.min(Math.round(it.f.d*CEIL[cls]), it.g + 10); moved = true; break; }
    }
    if(!moved) break;
  }
  items.forEach(it=> it.g = snapUnit(it.g, it.f));
  return items;
}

/* قرّب الوزن لوحدة منزلية طبيعية: 8 قطع مش 7 قطع و٣/٤ */
const WHOLE_U = ['قطعة','بيضة','قرص','شريحة','حبة','بلحة','موزة','تفاحة','برتقالة','مثلث','ساندوتش','صدر','سمكة','علبة','مكعب','أصبع','مانجة'];
const HALF_U  = ['رغيف','كوب','طبق','حصة','ملعقة','حفنة'];
function snapUnit(g, f){
  const [un, ug] = f.u || ['',0];
  if(un && ug){
    if(WHOLE_U.includes(un) && ug >= 15) return Math.max(ug, Math.round(g/ug)*ug);
    if(HALF_U.includes(un)){ const h = ug/2; return Math.max(h, Math.round(g/h)*h); }
  }
  return Math.max(5, Math.round(g/5)*5);
}

/* ---- وصف الكمية بالعين ---- */
const FRAC = [[0.25,'ربع'],[0.33,'تلت'],[0.5,'نص'],[0.66,'تلتين'],[0.75,'٣/٤']];
const PLUR = {'بيضة':'بيضات','قطعة':'قطع','رغيف':'أرغفة','قرص':'أقراص','ملعقة':'ملاعق',
  'كوب':'أكواب','طبق':'أطباق','حبة':'حبات','صدر':'صدور','شريحة':'شرائح','مثلث':'مثلثات',
  'حفنة':'حفنات','مكعب':'مكعبات','موزة':'موزات','تفاحة':'تفاحات','سمكة':'سمكات','علبة':'علب',
  'بلحة':'بلحات','أصبع':'أصابع','حصة':'حصص','برتقالة':'برتقالات','مانجة':'مانجات',
  'ساندوتش':'ساندوتشات'};
function dual(u){ return /ة$/.test(u) ? u.slice(0,-1)+'تين' : u+'ين'; }
function plur(u){ return PLUR[u] || u; }
function pretty(g, f){
  const [un, ug] = f.u || ['',0];
  if(!un || !ug) return g + ' جم';
  const n = g/ug;
  if(n < 0.2) return g + ' جم';
  if(n < 0.9){
    let best = FRAC[0];
    FRAC.forEach(fr=>{ if(Math.abs(fr[0]-n) < Math.abs(best[0]-n)) best = fr; });
    return best[1] + ' ' + un;
  }
  const r = Math.round(n*4)/4;                 // لأقرب ربع
  if(r <= 1.12) return un + ' واحد';
  if(r === 1.25) return un + ' وربع';
  if(r === 1.5)  return un + ' ونص';
  if(r === 1.75) return un + ' و٣/٤';
  if(r === 2)    return dual(un);
  const whole = Math.floor(r), rest = r - whole;
  const tail = rest === 0.25 ? ' وربع' : rest === 0.5 ? ' ونص' : rest === 0.75 ? ' و٣/٤' : '';
  if(whole === 2) return dual(un) + tail;
  return whole + ' ' + plur(un) + tail;
}

/* ---- تقييم الوجبة ---- */
function verdictOf(k, p, target){
  const r = k/target;
  if(r > 1.35) return {v:'تقيلة جداً', c:'hot'};
  if(r > 1.12) return {v:'تقيلة', c:'warn'};
  if(r < 0.80) return {v:'خفيفة', c:''};
  if(p >= 30 && r <= 1.06) return {v:'تمام', c:''};
  return {v:'كويسة', c:''};
}

/* ---- ملاحظات ذكية بدون نت ---- */
function tipsFor(items, k, p, target){
  const t = [];
  if(p < 25) t.push({h:'زوّد البروتين', b:'البروتين قليل هنا. ضيف كوب زبادي (13 جم) أو 100 جم قريش (15 جم) أو بيضتين (13 جم).'});
  const fried = items.find(it=> /مقلي|مقلية|محمرة|بانيه|باذنجان/.test(it.f.n));
  if(fried) t.push({h:'تحضير أخف', b:`${fried.f.n} في الفرن أو الإيرفراير بدل القلي بيوفر 120 لـ 200 سعرة.`});
  const heavyFat = items.find(it=> it.f.f >= 50 && it.f.cls==='fat');
  if(heavyFat) t.push({h:'خد بالك', b:`${heavyFat.f.n} كثيف جداً — ملعقة زيادة تساوي حوالي 100 سعرة.`});
  if(k > target*1.12) t.push({h:'لو عايز تنزّلها', b:'قلل النشويات (الرز أو العيش) الأول، وسيب البروتين زي ما هو.'});
  if(k < target*0.80) t.push({h:'فيه مساحة', b:`الوجبة دي أقل من ميزانيتك بـ ${Math.round(target-k)} سعرة. تقدر تكبّر الكمية أو تضيف صنف بروتين.`});
  const noVeg = !items.some(it=> it.f.cls==='veg');
  if(noVeg) t.push({h:'ناقصها', b:'ضيف طبق سلطة بلدي — بيشبعك وسعراته شبه صفر.'});
  return t;
}


/* ============ SWAP (offline) ============ */
let SW = { slot:null, q:'', items:[], unknown:[], done:false };

function openSwap(i){ SW = {slot:i, q:'', items:[], unknown:[], done:false}; go('swap'); }
function pickSlot(i){ SW.slot=i; if(SW.done) computeSwap(SW.q); else render(); }
function quick(q){ SW.q=q; computeSwap(q); }

function budgetOf(){
  const plan = DAYS[dayIdx()], meals = M[plan.m];
  if(SW.slot!==null && meals[SW.slot] && !meals[SW.slot].free) return meals[SW.slot].k;
  return 650;
}

function computeSwap(q){
  q = (q||'').trim(); if(!q) return;
  SW.q = q;
  const {items, unknown} = parseQuery(q);
  SW.unknown = unknown;
  SW.items = items;
  if(items.length) allocate(items, budgetOf());
  SW.done = true;
  if(items.length){
    S.hist = [q, ...S.hist.filter(x=>x!==q)].slice(0,12);
    save();
  }
  render();
}
function askSwap(){ const el=document.getElementById('sq'); computeSwap(el?el.value:SW.q); }
function adj(i, d){
  const it = SW.items[i]; if(!it) return;
  it.g = Math.max(5, it.g + d);
  render();
}
function dropItem(i){ SW.items.splice(i,1); render(); }
function reAlloc(){ if(SW.items.length){ allocate(SW.items, budgetOf()); render(); } }

function vSwap(){
  const plan = DAYS[dayIdx()], meals = M[plan.m];
  const target = budgetOf();
  let h = head('اكتب الأكل وهيحسبلك وزن كل صنف — شغال من غير نت', 'بديل الوجبة');

  h += `<div class="card"><h3>بدل أنهي وجبة؟</h3><div>`;
  meals.forEach((m,i)=>{ h += `<button class="pill ${SW.slot===i?'on':''}" onclick="pickSlot(${i})">${m.t}</button>`; });
  h += `<button class="pill ${SW.slot===null?'on':''}" onclick="pickSlot(null)">مجرد سؤال</button></div>
    <div class="muted" style="margin-top:4px">الميزانية: ${target} سعرة</div>
    <div class="row" style="margin-top:12px">
      <input id="sq" placeholder="مثال: ملوخية وفراخ ورز" value="${SW.q.replace(/"/g,'&quot;')}"
        onkeydown="if(event.key==='Enter')askSwap()">
      <button class="btn btn2" style="margin:0;width:auto;padding:11px 18px" onclick="askSwap()">احسب</button>
    </div>`;
  if(S.hist.length){
    h += `<div class="hist">`;
    S.hist.slice(0,8).forEach(x=>{ h+=`<button onclick="quick('${x.replace(/'/g,"\\'")}')">${x}</button>`; });
    h += `</div>`;
  }
  h += `</div>`;

  if(SW.done && SW.unknown.length){
    h += `<div class="card"><div class="note" style="border-right-color:var(--bad)">
      <b>مش لاقي:</b> ${SW.unknown.join('، ')} — مش موجودة في بنك الأكل.
      جرب اسم أبسط (مثلاً "فراخ" بدل "فراخ بالكاري")، أو دوّر في جدول الأكل في تاب "الأكل".</div></div>`;
  }

  if(SW.done && SW.items.length){
    const k = Math.round(kcalOf(SW.items)), p = Math.round(protOf(SW.items));
    const v = verdictOf(k, p, target);
    h += `<div class="card" style="padding:0;border:none;background:none">
      <div class="res ${v.c}">
        <div class="top"><div class="v">${v.v} · الميزانية ${target} سعرة</div>
          <div class="n">${SW.items.map(x=>x.f.n).join(' + ')}</div></div>
        <div class="big">
          <div><b>${k}</b><span>سعرة إجمالي</span></div>
          <div><b>${p}</b><span>جم بروتين</span></div>
        </div>
        <table style="font-size:12.5px">
          <tr><th>الصنف</th><th>الوزن</th><th>سعرات</th><th>بروتين</th><th></th></tr>`;
    SW.items.forEach((it,i)=>{
      h += `<tr>
        <td>${it.f.n}<div class="muted" style="font-size:11px">${pretty(it.g, it.f)}</div></td>
        <td style="white-space:nowrap">
          <button class="stp" onclick="adj(${i},-10)">−</button>
          <b class="hi">${it.g}</b><span class="muted" style="font-size:10.5px"> جم</span>
          <button class="stp" onclick="adj(${i},10)">+</button>
        </td>
        <td>${Math.round(it.f.k*it.g/100)}</td>
        <td>${Math.round(it.f.p*it.g/100)} جم</td>
        <td><span class="del" onclick="dropItem(${i})">×</span></td>
      </tr>`;
    });
    h += `</table><div class="bd">`;
    tipsFor(SW.items, k, p, target).forEach(t=>{ h += `<span class="k">${t.h}</span>${t.b}`; });
    h += `</div></div>
      <div class="row" style="margin-top:11px">
        <button class="btn btn3" style="margin:0" onclick="reAlloc()">اظبط الكميات تلقائي</button>`;
    if(SW.slot!==null) h += `<button class="btn btn2" style="margin:0" onclick="useSwap()">سجّلها كـ${meals[SW.slot].t}</button>`;
    h += `</div></div>`;
  }

  h += `<div class="card"><h3>إزاي بتشتغل</h3><div style="font-size:13.5px;line-height:1.75">
    بنك الأكل جوه التطبيق فيه ${FDB.length} صنف مصري بسعراتهم وبروتينهم لكل 100 جم —
    <b>مفيش نت ولا انتظار</b>، الحساب فوري.<br><br>
    اكتب صنف واحد أو وجبة كاملة زي "ملوخية وفراخ ورز"، والتطبيق بيقسمها ويوزّع الكميات
    على ميزانية الوجبة والأولوية للبروتين. تقدر تعدّل أي وزن بـ − و + والأرقام بتتحدث فوراً.</div></div>`;
  return h;
}

function useSwap(){
  if(!SW.items.length || SW.slot===null) return;
  const e = entry(today());
  e.sw[SW.slot] = {
    n: SW.items.map(x=>x.f.n).join(' + '),
    items: SW.items.map(x=>({n:x.f.n, g:x.g, k:Math.round(x.f.k*x.g/100), p:Math.round(x.f.p*x.g/100)})),
    k: Math.round(kcalOf(SW.items)), p: Math.round(protOf(SW.items))
  };
  e.m[SW.slot] = true;
  save(); go('today');
}
function clearSw(){ const e=entry(today()); e.sw={}; save(); render(); }

/* ============ ACTIONS ============ */
function toggleM(i){ const e=entry(today()); e.m[i] = !e.m[i]; save(); render(); }
function toggleW(){ const e=entry(today()); e.w = !e.w; save(); render(); }
function addW(){
  const v = parseFloat(document.getElementById('wv').value);
  if(!v || v<30 || v>300) return;
  const d = today();
  S.weights = S.weights.filter(x=>x.d!==d);
  S.weights.push({d, w: Math.round(v*10)/10});
  save(); render();
}
function delW(d){ S.weights = S.weights.filter(x=>x.d!==d); save(); render(); }


/* ============ الصوت: عدّ تنازلي وصفارة التبديل ============ */
let AC = null, SND = true;
function initAudio(){
  if(AC) return;
  try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ AC = null; }
}
function beep(freq, ms, vol){
  if(!SND) return;
  try{
    initAudio(); if(!AC) return;
    if(AC.state === 'suspended') AC.resume();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    o.connect(g); g.connect(AC.destination);
    const t = AC.currentTime;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol||0.28, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + ms/1000);
    o.start(t); o.stop(t + ms/1000 + 0.02);
  }catch(e){}
}
function tickBeep(){ beep(880, 110); if(navigator.vibrate) navigator.vibrate(60); }        // تيت
function goBeep(){                                                                          // بدأ تمرين
  beep(1320, 320, 0.34);
  if(navigator.vibrate) navigator.vibrate([200,70,200]);
}
function restBeep(){                                                                        // راحة
  beep(520, 300, 0.3);
  if(navigator.vibrate) navigator.vibrate(220);
}
function doneBeep(){
  beep(880, 200, 0.34); setTimeout(()=>beep(1100, 200, 0.34), 220); setTimeout(()=>beep(1320, 420, 0.36), 450);
  if(navigator.vibrate) navigator.vibrate([200,90,200,90,380]);
}
function toggleSnd(){
  SND = !SND;
  const b = document.getElementById('tmSnd');
  if(b) b.textContent = SND ? '🔊' : '🔇';
  if(SND) beep(880, 120);
}

/* ============ TIMER ============ */
let T = { steps:[], i:0, left:0, id:null, paused:false, key:null };

function buildSteps(di){
  const w = workoutOf(di), s = [];
  if(w.type==='seq'){
    w.seq.forEach(x=> s.push({ph:'إطالة', a:x.a, e:x.e, alt:x.alt||'', t:x.s, rest:false}));
    return s;
  }
  if(w.warmK && WARM[w.warmK])
    WARM[w.warmK].forEach((x,j)=> s.push({ph:`إحماء ${j+1} من ${WARM[w.warmK].length}`, a:x.a, e:x.e, alt:x.alt, t:x.s, rest:false}));
  else if(w.warm) s.push({ph:'إحماء', a:'إحماء', e:'Warm-up', alt:'', t:w.warm, rest:false});
  if(w.type==='circuit'){
    for(let r=1;r<=w.rounds;r++){
      w.ex.forEach((x,j)=>{
        s.push({ph:`دورة ${r} من ${w.rounds}`, a:x.a, e:x.e, alt:x.alt, t:w.work, rest:false});
        if(j<w.ex.length-1) s.push({ph:'راحة', a:'راحة', e:'Rest', alt:'', t:w.rest, rest:true});
      });
      if(r<w.rounds) s.push({ph:'راحة بين الدورات', a:'راحة', e:'Round Rest', alt:'خد نفسك', t:w.rrest, rest:true});
    }
  }
  if(w.type==='rounds'){
    w.ex.forEach((x,j)=>{
      s.push({ph:`جولة ${j+1} من ${w.ex.length}`, a:x.a, e:x.e, alt:x.alt, t:w.work, rest:false});
      if(j<w.ex.length-1) s.push({ph:'راحة', a:'راحة', e:'Rest', alt:'', t:w.rest, rest:true});
    });
  }
  if(w.type==='intervals'){
    for(let j=1;j<=w.count;j++){
      s.push({ph:`جولة ${j} من ${w.count}`, a:w.ex[0].a, e:w.ex[0].e, alt:w.ex[0].alt, t:w.work, rest:false});
      if(j<w.count) s.push({ph:'راحة', a:'راحة', e:'Rest', alt:'', t:w.rest, rest:true});
    }
  }
  if(w.coolK && COOL[w.coolK])
    COOL[w.coolK].forEach((x,j)=> s.push({ph:`تهدئة ${j+1} من ${COOL[w.coolK].length}`, a:x.a, e:x.e, alt:x.alt, t:x.s, rest:true, soft:true}));
  else if(w.cool) s.push({ph:'تهدئة', a:'تهدئة وإطالة', e:'Cool-down', alt:'', t:w.cool, rest:true});
  return s;
}

function startW(di){
  initAudio(); if(AC && AC.state==='suspended') AC.resume();
  beep(1320, 150);
  T.key=di; T.steps=buildSteps(di); T.i=0; T.left=T.steps[0].t; T.paused=false;
  document.getElementById('tm').classList.add('show');
  paint(); clearInterval(T.id); T.id=setInterval(tick,1000);
}
function paint(){
  const st = T.steps[T.i], tm = document.getElementById('tm');
  tm.classList.toggle('rest', !!st.rest);
  document.getElementById('tmPh').textContent = st.ph;
  document.getElementById('tmEx').textContent = st.e;
  document.getElementById('tmExE').textContent = st.a;
  document.getElementById('tmAlt').textContent = st.alt && st.alt!=='—' ? 'أسهل: '+st.alt : '';
  const yt = document.getElementById('tmYt');
  if(st.rest && !st.soft){ yt.style.display='none'; }
  else { yt.style.display='inline-block'; yt.href = ytUrl(st.e); }
  const nx = T.steps[T.i+1];
  document.getElementById('tmNx').textContent = nx ? 'الجاي: '+nx.e : 'آخر خطوة';
  document.getElementById('tmCnt').textContent = `${T.i+1} من ${T.steps.length}`;
  const m=Math.floor(T.left/60), s=T.left%60;
  document.getElementById('tmCd').textContent = m>0 ? m+':'+String(s).padStart(2,'0') : String(s).padStart(2,'0');
  document.getElementById('tmPb').style.width = Math.round(T.i/T.steps.length*100)+'%';
}
function tick(){
  if(T.paused) return;
  T.left--;
  if(T.left > 0 && T.left <= 3) tickBeep();            // تيت تيت تيت
  if(T.left<=0){
    if(T.i >= T.steps.length-1){ doneBeep(); finishW(); return; }
    T.i++; T.left = T.steps[T.i].t;
    T.steps[T.i].rest ? restBeep() : goBeep();          // صوت مختلف: شغل ولا راحة
  }
  paint();
}
function tmToggle(){ T.paused=!T.paused; document.getElementById('tmPause').textContent = T.paused?'كمّل':'إيقاف مؤقت'; }
function tmSkip(){
  if(T.i >= T.steps.length-1){ finishW(); return; }
  T.i++; T.left=T.steps[T.i].t; paint();
}
function finishW(){
  clearInterval(T.id);
  document.getElementById('tm').classList.remove('show');
  if(navigator.vibrate) navigator.vibrate([180,90,180]);
  entry(today()).w = true; save(); go('today');
}
function tmQuit(){ clearInterval(T.id); document.getElementById('tm').classList.remove('show'); render(); }

(async function(){ await load(); render(); })();
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
